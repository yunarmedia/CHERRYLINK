<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHERRLINK - Halaman Publik</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; color: #ffffff; background: linear-gradient(135deg, #1f2937 0%, #111827 100%); animation: fadeIn 1s ease-in-out; position: relative; padding-bottom: 80px; }
        .bg-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.45); z-index: -1; }
        #public-view { max-width: 480px; width: 90%; padding: 60px 20px 40px; text-align: center; z-index: 1; }
        
        .profile-wrapper { position: relative; display: inline-block; margin-bottom: 20px; }
        .profile-img { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 3px solid rgba(255, 255, 255, 0.8); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); position: relative; z-index: 2; }
        .profile-glow { position: absolute; top: 10%; left: 10%; width: 80%; height: 80%; background: rgba(255, 255, 255, 0.5); filter: blur(20px); z-index: 1; border-radius: 50%; }
        
        .name { font-size: 24px; font-weight: 700; margin: 0 0 8px; letter-spacing: -0.5px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .bio { font-size: 15px; font-weight: 400; opacity: 0.9; margin-bottom: 40px; line-height: 1.6; text-shadow: 0 1px 3px rgba(0,0,0,0.5); }
        
        .link-btn { display: flex; align-items: center; justify-content: center; background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.3); color: white; text-decoration: none; padding: 16px 20px; margin-bottom: 16px; border-radius: 16px; font-weight: 600; font-size: 15px; transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); position: relative; overflow: hidden; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); }
        .link-btn:hover { background: rgba(255, 255, 255, 0.25); transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2); border-color: rgba(255, 255, 255, 0.5); }
        .link-icon { width: 40px; height: 40px; border-radius: 10px; object-fit: cover; position: absolute; left: 12px; background-color: rgba(255, 255, 255, 0.2); padding: 2px; box-sizing: border-box; }
        
        #loading, #error-view { margin-top: 40vh; font-size: 16px; font-weight: 500; text-align: center; padding: 20px; }
        #loading { animation: pulse 1.5s infinite; }
        #error-view h2 { margin: 0 0 10px; font-size: 32px; }

        /* TOMBOL PROMOSI CHERRLINK */
        .promo-cherrlink { position: absolute; bottom: 20px; background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.4); color: white; text-decoration: none; padding: 10px 20px; border-radius: 30px; font-size: 13px; font-weight: 600; transition: 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 10; }
        .promo-cherrlink:hover { background: rgba(255, 255, 255, 0.4); transform: translateY(-2px); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
    </style>
</head>
<body>
    <div class="bg-overlay"></div>
    <div id="loading">✨ Memuat Profil...</div>
    
    <div id="error-view" style="display: none;">
        <h2>Oops! 🙈</h2>
        <p>Halaman tidak ditemukan.</p>
    </div>

    <div id="public-view" style="display: none;">
        <div class="profile-wrapper">
            <div class="profile-glow"></div>
            <img id="display-pic" src="" alt="Profile" class="profile-img">
        </div>
        <h1 id="display-name" class="name"></h1>
        <div id="display-bio" class="bio"></div>
        <div id="links-container"></div>
    </div>

    <!-- Tombol Registrasi Publik -->
    <a href="admin.html" class="promo-cherrlink">🍒 Coba CHERRLINK juga</a>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDjz5CRk3lPfCkCMwUQkeratVBF1RV58Nk",
            authDomain: "yunarlinks.firebaseapp.com",
            projectId: "yunarlinks",
            storageBucket: "yunarlinks.firebasestorage.app",
            messagingSenderId: "34387541307",
            appId: "1:34387541307:web:ac3640d587e2ecbb074b1e",
            databaseURL: "https://yunarlinks-default-rtdb.asia-southeast1.firebasedatabase.app"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const urlParams = new URLSearchParams(window.location.search);
        const pageId = urlParams.get('u');

        if (!pageId) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error-view').style.display = 'block';
        } else {
            onValue(ref(db, 'pages/' + pageId), (snapshot) => {
                const data = snapshot.val();
                document.getElementById('loading').style.display = 'none';

                if (data) {
                    document.getElementById('public-view').style.display = 'block';
                    document.getElementById('display-name').innerText = data.nama || 'Tanpa Nama';
                    document.getElementById('display-bio').innerText = data.bio || '';
                    document.getElementById('display-pic').src = data.foto || 'https://ui-avatars.com/api/?name=User&background=random&size=200';
                    
                    if(data.background) {
                        if(data.background.startsWith('data:image')) {
                            document.body.style.backgroundImage = `url('${data.background}')`;
                            document.body.style.backgroundSize = "cover"; document.body.style.backgroundPosition = "center"; document.body.style.backgroundAttachment = "fixed";
                        } else {
                            document.body.style.background = data.background;
                        }
                    }

                    const linksBox = document.getElementById('links-container');
                    linksBox.innerHTML = ''; 
                    if(data.links && Array.isArray(data.links)) {
                        data.links.forEach(link => {
                            const iconHtml = link.icon ? `<img src="${link.icon}" class="link-icon" alt="icon">` : '';
                            linksBox.innerHTML += `<a href="${link.url}" target="_blank" class="link-btn">${iconHtml}<span>${link.title}</span></a>`;
                        });
                    }
                } else {
                    document.getElementById('error-view').style.display = 'block';
                }
            });
        }
    </script>
</body>
</html>
